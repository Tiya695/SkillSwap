spring.application.name=skillswap
spring.profiles.active=dev
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillswap?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.date-of-birth=${ADMIN_DOB:2000-01-01}
app.seed.demo-users=${SEED_DEMO_USERS:false}

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.quiz.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.quiz.model=${OLLAMA_MODEL:phi3:latest}
app.quiz.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:300}

springdoc.swagger-ui.path=/swagger-ui.html
